[package]
name = "plume"
version = "0.3.0"
description = "Plume — transcription locale de fichiers audio en texte et Word"
authors = ["Plume"]
edition = "2021"
license = "MIT"
default-run = "plume"

[lib]
name = "plume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "unstable-locales"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
strsim = "0.11"
symphonia = { version = "0.5.5", features = [
  "aac",
  "alac",
  "isomp4",
  "mp3",
  "aiff",
  "flac",
  "ogg",
  "vorbis",
  "wav",
  "pcm",
] }
rubato = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16" }

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
